<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shopp Wholesale — Admin</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#f4f9f4;font-family:system-ui}
.admin-wrap{max-width:1100px;margin:20px auto;padding:14px}
.admin-top{display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.primary{background:#2bb26b;color:#fff}
.btn.secondary{background:#e5e7eb}
.btn.warn{background:#e53e3e;color:#fff}
.small{font-size:13px}
.hidden{display:none}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:600;margin-top:8px;display:block}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.item-admin{background:#fff;border-radius:10px;padding:12px;border:1px solid #eee;cursor:pointer}
.muted{color:#666;font-size:13px}
.order-row{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px}
</style>

<script>
/* ---------- FIREBASE INIT ---------- */
firebase.initializeApp({
  apiKey:"AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain:"shopp-wholesale.firebaseapp.com",
  projectId:"shopp-wholesale",
  appId:"1:811103669232:web:825724b3738658192b6b35"
});
const db = firebase.firestore();
</script>
</head>

<body>

<div class="admin-wrap">

<div class="admin-top">
  <h2>Shopp Wholesale — Admin</h2>
  <div>
    <span id="admin-badge" class="hidden"><b>ADMIN</b></span>
    <button id="btn-login" class="btn secondary small">Login</button>
    <button id="btn-logout" class="btn secondary small hidden">Logout</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="card">
<h3>Dashboard</h3>
<div class="grid">
 <div><b>Items Sold</b><br><span id="d-items">0</span></div>
 <div><b>Order Value</b><br>₹<span id="d-revenue">0</span></div>
 <div><b>Inventory Qty</b><br><span id="inv-items">0</span></div>
 <div><b>Inventory Value</b><br>₹<span id="inv-value">0</span></div>
</div>
</div>

<!-- ADD / EDIT ITEM -->
<div class="card">
<h3>Add / Edit Item</h3>
<form id="item-form">

<input type="hidden" id="item-id">

<label>Name</label>
<input id="item-name" required>

<label>Category</label>
<input id="item-category">

<label>MRP</label>
<input id="item-mrp" type="number">

<label>Sale Price</label>
<input id="item-price" type="number" required>

<label>Stock</label>
<input id="item-stock" type="number">

<label>Product Image</label>
<input type="file" id="imagePicker" accept="image/*">

<img id="imagePreview" style="width:80px;height:80px;border-radius:8px;display:none;margin:8px 0">

<input id="item-image" placeholder="Image URL (auto)" readonly>

<div style="margin-top:10px;display:flex;gap:8px">
 <button class="btn primary" type="submit">Save Item</button>
 <button type="button" id="btn-delete" class="btn warn hidden">Delete</button>
</div>

</form>
</div>

<div class="card">
<h3>Products</h3>
<div id="items-list" class="items-grid"></div>
</div>

</div>

<script>
const el = id => document.getElementById(id);
const ADMIN_PIN = "Sreekanth@1";
const IMGBB_KEY = "a70f2274f5053512d046cb5878c63041";

/* ---------- LOGIN ---------- */
el("btn-login").onclick = () => {
  const pin = prompt("Enter Admin PIN");
  if (pin === ADMIN_PIN) {
    sessionStorage.setItem("admin","1");
    enableAdmin();
  } else alert("Wrong PIN");
};

el("btn-logout").onclick = () => {
  sessionStorage.removeItem("admin");
  location.reload();
};

function enableAdmin(){
  el("admin-badge").classList.remove("hidden");
  el("btn-login").classList.add("hidden");
  el("btn-logout").classList.remove("hidden");
  loadStats(); loadInventory(); loadItems();
}

if(sessionStorage.getItem("admin")==="1") enableAdmin();

/* ---------- IMAGE UPLOAD ---------- */
el("imagePicker").addEventListener("change", async ()=>{
  const file = imagePicker.files[0];
  if(!file) return;

  imagePreview.src = URL.createObjectURL(file);
  imagePreview.style.display="block";
  item-image.value = "Uploading...";

  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const form = new FormData();
    form.append("image", base64);

    try{
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{
        method:"POST", body:form
      });
      const json = await res.json();
      if(!json.success) throw "fail";
      item-image.value = json.data.display_url;
    }catch{
      alert("Image upload failed");
      item-image.value="";
    }
  };
  reader.readAsDataURL(file);
});

/* ---------- SAVE ITEM (FINAL FIX) ---------- */
el("item-form").onsubmit = async e=>{
  e.preventDefault();

  if(item-image.value==="Uploading..."){
    alert("Please wait for image upload");
    return;
  }

  const data = {
    name: item-name.value.trim(),
    category: item-category.value.trim(),
    mrp: Number(item-mrp.value||0),
    price: Number(item-price.value||0),
    stock: Number(item-stock.value||0),
    image: item-image.value.trim()
  };

  try{
    if(item-id.value){
      await db.collection("items").doc(item-id.value).update(data);
      alert("Item updated");
    }else{
      await db.collection("items").add(data);
      alert("Item saved");
    }
    clearForm(); loadItems(); loadInventory();
  }catch(err){
    console.error(err);
    alert("Save failed");
  }
};

el("btn-delete").onclick = async ()=>{
  if(!item-id.value) return;
  if(confirm("Delete item?")){
    await db.collection("items").doc(item-id.value).delete();
    clearForm(); loadItems(); loadInventory();
  }
};

function clearForm(){
  ["item-id","item-name","item-category","item-mrp","item-price","item-stock","item-image"]
  .forEach(i=>el(i).value="");
  imagePreview.style.display="none";
  btn-delete.classList.add("hidden");
}

/* ---------- LOAD PRODUCTS ---------- */
async function loadItems(){
  items-list.innerHTML="";
  const snap = await db.collection("items").orderBy("name").get();
  snap.forEach(doc=>{
    const i=doc.data();
    const d=document.createElement("div");
    d.className="item-admin";
    d.innerHTML=`<b>${i.name}</b><br><span class="muted">₹${i.price} • Stock: ${i.stock}</span>`;
    d.onclick=()=>{
      item-id.value=doc.id;
      item-name.value=i.name;
      item-category.value=i.category||"";
      item-mrp.value=i.mrp||0;
      item-price.value=i.price||0;
      item-stock.value=i.stock||0;
      item-image.value=i.image||"";
      if(i.image){imagePreview.src=i.image;imagePreview.style.display="block";}
      btn-delete.classList.remove("hidden");
      window.scrollTo({top:0,behavior:"smooth"});
    };
    items-list.appendChild(d);
  });
}

/* ---------- STATS ---------- */
async function loadStats(){
  let sold=0,revenue=0;
  const snap=await db.collection("orders").get();
  snap.forEach(d=>{
    const o=d.data();
    (o.items||[]).forEach(i=>sold+=Number(i.qty||0));
    revenue+=Number(o.total||0);
  });
  d-items.innerText=sold;
  d-revenue.innerText=revenue;
}

async function loadInventory(){
  let qty=0,val=0;
  const snap=await db.collection("items").get();
  snap.forEach(d=>{
    const i=d.data();
    qty+=Number(i.stock||0);
    val+=Number(i.stock||0)*Number(i.price||0);
  });
  inv-items.innerText=qty;
  inv-value.innerText=val;
}
</script>

</body>
</html>
