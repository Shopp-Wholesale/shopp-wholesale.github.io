<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shopp Wholesale — Admin</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#f4f9f4;font-family:system-ui}
.admin-wrap{max-width:1100px;margin:20px auto;padding:14px}
.admin-top{display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.primary{background:#2bb26b;color:#fff}
.btn.secondary{background:#e5e7eb}
.btn.warn{background:#e53e3e;color:#fff}
.small{font-size:13px}
.hidden{display:none}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:600;margin-top:8px;display:block}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.item-admin{background:#fff;border-radius:10px;padding:12px;border:1px solid #eee;cursor:pointer}
.muted{color:#666;font-size:13px}
textarea{font-family:monospace;font-size:13px}
</style>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain:"shopp-wholesale.firebaseapp.com",
  projectId:"shopp-wholesale",
});
const db = firebase.firestore();
</script>
</head>

<body>

<div class="admin-wrap">

<div class="admin-top">
  <h2>Shopp Wholesale — Admin</h2>
  <div>
    <span id="admin-badge" class="hidden"><b>ADMIN</b></span>
    <button id="btn-login" class="btn secondary small">Login</button>
    <button id="btn-logout" class="btn secondary small hidden">Logout</button>
  </div>
</div>

<div class="card">
<h3>Add / Edit Item</h3>
<form id="item-form">

<input type="hidden" id="item-id">

<label>Name</label>
<input id="item-name" required>

<label>Category</label>
<input id="item-category">

<label>Product Image</label>
<input type="file" id="imagePicker" accept="image/*">
<img id="imagePreview" style="width:80px;height:80px;border-radius:8px;display:none;margin:8px 0">
<input id="item-image" placeholder="Image URL (auto)" readonly>

<label>Variants (JSON)</label>
<textarea id="item-variants" rows="6"
placeholder='[
  {
    "label":"1 kg",
    "mrp":75,
    "price":70,
    "stock":50,
    "deals":[
      {"qty":1,"price":70},
      {"qty":2,"price":68}
    ]
  },
  {
    "label":"5 kg",
    "mrp":360,
    "price":335,
    "stock":20
  }
]'></textarea>

<div style="margin-top:10px;display:flex;gap:8px">
 <button class="btn primary" type="submit">Save Item</button>
 <button type="button" id="btn-delete" class="btn warn hidden">Delete</button>
</div>

</form>
</div>

<div class="card">
<h3>Products</h3>
<div id="items-list" class="items-grid"></div>
</div>

</div>

<script>
const el=id=>document.getElementById(id);
const ADMIN_PIN="Sreekanth@1";
const IMGBB_KEY="a70f2274f5053512d046cb5878c63041";

/* LOGIN */
el("btn-login").onclick=()=>{
 if(prompt("Enter Admin PIN")===ADMIN_PIN){
  localStorage.setItem("admin","1");
  enableAdmin();
 } else alert("Wrong PIN");
};
el("btn-logout").onclick=()=>{localStorage.removeItem("admin");location.reload()};
if(localStorage.getItem("admin")==="1") enableAdmin();

function enableAdmin(){
 el("admin-badge").classList.remove("hidden");
 el("btn-login").classList.add("hidden");
 el("btn-logout").classList.remove("hidden");
 loadItems();
}

/* IMAGE UPLOAD */
el("imagePicker").addEventListener("change",()=>{
 const f=el("imagePicker").files[0]; if(!f) return;
 el("imagePreview").src=URL.createObjectURL(f);
 el("imagePreview").style.display="block";
 el("item-image").value="Uploading...";
 const r=new FileReader();
 r.onload=async()=>{
  const fd=new FormData(); fd.append("image",r.result.split(",")[1]);
  const res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd});
  const j=await res.json();
  el("item-image").value=j.data.display_url;
 };
 r.readAsDataURL(f);
});

/* SAVE */
el("item-form").onsubmit=async e=>{
 e.preventDefault();
 let variants=[];
 try{ variants=JSON.parse(el("item-variants").value||"[]"); }
 catch{ return alert("Invalid variants JSON"); }

 const data={
  name:el("item-name").value.trim(),
  category:el("item-category").value.trim(),
  image:el("item-image").value.trim(),
  variants
 };

 if(el("item-id").value)
  await db.collection("items").doc(el("item-id").value).update(data);
 else
  await db.collection("items").add(data);

 alert("Item saved");
 clearForm(); loadItems();
};

/* DELETE — FIXED */
el("btn-delete").onclick=async()=>{
 const id=el("item-id").value;
 if(!id) return;
 if(confirm("Delete item permanently?")){
  await db.collection("items").doc(id).delete();
  alert("Item deleted");
  clearForm(); loadItems();
 }
};

function clearForm(){
 ["item-id","item-name","item-category","item-image","item-variants"]
 .forEach(i=>el(i).value="");
 el("imagePreview").style.display="none";
 el("btn-delete").classList.add("hidden");
}

/* LOAD ITEMS */
async function loadItems(){
 el("items-list").innerHTML="";
 const snap=await db.collection("items").orderBy("name").get();
 snap.forEach(doc=>{
  const i=doc.data();
  const d=document.createElement("div");
  d.className="item-admin";
  d.innerHTML=`<b>${i.name}</b><br>
   <span class="muted">${i.variants?.length||0} variants</span>`;
  d.onclick=()=>{
   el("item-id").value=doc.id;
   el("item-name").value=i.name;
   el("item-category").value=i.category||"";
   el("item-image").value=i.image||"";
   el("item-variants").value=JSON.stringify(i.variants||[],null,2);
   if(i.image){el("imagePreview").src=i.image;el("imagePreview").style.display="block";}
   el("btn-delete").classList.remove("hidden");
   window.scrollTo({top:0,behavior:"smooth"});
  };
  el("items-list").appendChild(d);
 });
}
</script>

</body>
</html>
