<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shopp Wholesale — Admin</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#f4f9f4;font-family:system-ui}
.admin-wrap{max-width:1000px;margin:20px auto;padding:14px}
.admin-top{display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.primary{background:#2bb26b;color:#fff}
.btn.secondary{background:#e5e7eb}
.btn.warn{background:#e53e3e;color:#fff}
.small{font-size:13px}
.hidden{display:none}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:600;margin-top:8px;display:block}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.item-admin{background:#fff;border-radius:10px;padding:12px}
.muted{color:#666;font-size:13px}
.order-row{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px}
img.preview{width:80px;height:80px;border-radius:8px;object-fit:cover;margin-top:6px}
</style>

<script>
/* FIREBASE */
firebase.initializeApp({
 apiKey:"AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
 authDomain:"shopp-wholesale.firebaseapp.com",
 projectId:"shopp-wholesale"
});
const db=firebase.firestore();
</script>
</head>

<body>

<div class="admin-wrap">

<!-- HEADER -->
<div class="admin-top">
  <h2>Shopp Wholesale — Admin</h2>
  <div>
    <span id="admin-badge" class="hidden"><b>ADMIN</b></span>
    <button id="btn-login" class="btn secondary small">Login</button>
    <button id="btn-logout" class="btn secondary small hidden">Logout</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="card">
<h3>Dashboard</h3>
<div class="grid">
 <div><b>Today Orders</b><br><span id="d-today">0</span></div>
 <div><b>Week Orders</b><br><span id="d-week">0</span></div>
 <div><b>Month Orders</b><br><span id="d-month">0</span></div>
 <div><b>Items Sold</b><br><span id="d-items">0</span></div>
 <div><b>Order Value</b><br>₹<span id="d-revenue">0</span></div>
 <div><b>Inventory Qty</b><br><span id="inv-items">0</span></div>
 <div><b>Inventory Value</b><br>₹<span id="inv-value">0</span></div>
</div>
</div>

<!-- ADD / EDIT ITEM -->
<div class="card">
<h3>Add / Edit Item</h3>

<form id="item-form">
<input type="hidden" id="item-id">

<label>Name</label>
<input id="item-name" required>

<label>Category</label>
<input id="item-category">

<label>MRP</label>
<input id="item-mrp" type="number">

<label>Sale Price</label>
<input id="item-price" type="number" required>

<label>Stock</label>
<input id="item-stock" type="number">

<label>Image URL</label>
<input id="item-image">

<button type="button" class="btn secondary small" onclick="pickImage()">Select Image</button>
<input type="file" id="imagePicker" accept="image/*" class="hidden">
<img id="imagePreview" class="preview hidden">

<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn primary" type="submit">Save Item</button>
<button type="button" class="btn warn hidden" id="btn-delete">Delete</button>
</div>
</form>
</div>

<!-- PRODUCTS -->
<div class="card">
<h3>Products</h3>
<div id="items-list" class="items-grid"></div>
</div>

<!-- ORDERS -->
<div class="card">
<h3>Orders</h3>
<div id="orders-list"></div>
</div>

</div>

<script>
const el=id=>document.getElementById(id);
const ADMIN_PIN="Sreekanth@1";

/* LOGIN */
btn-login.onclick=()=>{
 if(prompt("Enter Admin PIN")===ADMIN_PIN){
  sessionStorage.setItem("admin","1");
  location.reload();
 }
};
btn-logout.onclick=()=>{sessionStorage.clear();location.reload()};
if(sessionStorage.getItem("admin")){
 admin-badge.classList.remove("hidden");
 btn-login.classList.add("hidden");
 btn-logout.classList.remove("hidden");
 loadAll();
}

/* IMAGE PICKER */
function pickImage(){ el("imagePicker").click(); }
imagePicker.onchange=()=>{
 const f=imagePicker.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=e=>{
  imagePreview.src=e.target.result;
  imagePreview.classList.remove("hidden");
  item-image.value=e.target.result; // base64
 };
 r.readAsDataURL(f);
};

/* SAVE ITEM */
item-form.onsubmit=async e=>{
 e.preventDefault();
 const id=item-id.value;
 const data={
  name:item-name.value,
  category:item-category.value,
  mrp:+item-mrp.value||0,
  price:+item-price.value,
  stock:+item-stock.value||0,
  image:item-image.value
 };
 id?await db.collection("items").doc(id).update(data)
   :await db.collection("items").add(data);
 location.reload();
};

/* DELETE */
btn-delete.onclick=async()=>{
 if(confirm("Delete item?")){
  await db.collection("items").doc(item-id.value).delete();
  location.reload();
 }
};

/* LOAD ALL */
async function loadAll(){
 loadStats(); loadInventory(); loadItems(); loadOrders();
}

/* DASHBOARD + INVENTORY */
async function loadStats(){
 let t=0,w=0,m=0,i=0,r=0;
 const now=new Date();
 const d0=new Date(now.setHours(0,0,0,0));
 const w0=new Date(); w0.setDate(w0.getDate()-7);
 const m0=new Date(new Date().getFullYear(),new Date().getMonth(),1);
 const s=await db.collection("orders").get();
 s.forEach(d=>{
  const o=d.data(); if(!o.createdAt)return;
  const dt=o.createdAt.toDate();
  if(dt>=d0)t++; if(dt>=w0)w++; if(dt>=m0)m++;
  (o.items||[]).forEach(x=>i+=x.qty);
  r+=o.total||0;
 });
 d-today.innerText=t; d-week.innerText=w; d-month.innerText=m;
 d-items.innerText=i; d-revenue.innerText=r;
}
async function loadInventory(){
 let q=0,v=0;
 const s=await db.collection("items").get();
 s.forEach(d=>{q+=d.data().stock||0;v+=(d.data().stock||0)*(d.data().price||0)});
 inv-items.innerText=q; inv-value.innerText=v;
}

/* PRODUCTS */
async function loadItems(){
 const s=await db.collection("items").orderBy("name").get();
 s.forEach(d=>{
  const i=d.data();
  const c=document.createElement("div");
  c.className="item-admin";
  c.innerHTML=`<img src="${i.image}" class="preview"><b>${i.name}</b><br>
   ₹${i.price} • Stock ${i.stock}<br>
   <button class="btn secondary small">Edit</button>`;
  c.querySelector("button").onclick=()=>{
   item-id.value=d.id;
   item-name.value=i.name;
   item-category.value=i.category||"";
   item-mrp.value=i.mrp||0;
   item-price.value=i.price;
   item-stock.value=i.stock;
   item-image.value=i.image;
   imagePreview.src=i.image;
   imagePreview.classList.remove("hidden");
   btn-delete.classList.remove("hidden");
   window.scrollTo({top:0,behavior:"smooth"});
  };
  items-list.appendChild(c);
 });
}

/* ORDERS */
async function loadOrders(){
 const s=await db.collection("orders").orderBy("createdAt","desc").limit(20).get();
 s.forEach(d=>{
  const o=d.data();
  orders-list.innerHTML+=`<div class="order-row">
   <b>${o.customerName}</b><br>₹${o.total} • ${o.status}
  </div>`;
 });
}
</script>

</body>
</html>
