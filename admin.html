<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shopp Wholesale — Admin</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;background:#f4f9f4;font-family:system-ui}
.admin-wrap{max-width:1000px;margin:20px auto;padding:14px}
.admin-top{display:flex;justify-content:space-between;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
.btn.primary{background:#2bb26b;color:#fff}
.btn.secondary{background:#e5e7eb}
.btn.warn{background:#e53e3e;color:#fff}
.small{font-size:13px}
.hidden{display:none}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:600;margin-top:8px;display:block}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd}
.items-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.item-admin{background:#fff;border-radius:10px;padding:12px}
.muted{color:#666;font-size:13px}
.order-row{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px}
</style>

<script>
/* ---------------- FIREBASE INIT ---------------- */
const firebaseConfig={
 apiKey:"AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
 authDomain:"shopp-wholesale.firebaseapp.com",
 projectId:"shopp-wholesale",
 appId:"1:811103669232:web:825724b3738658192b6b35"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script>
</head>

<body>

<div class="admin-wrap">

<!-- HEADER -->
<div class="admin-top">
  <h2>Shopp Wholesale — Admin</h2>
  <div>
    <span id="admin-badge" class="hidden"><b>ADMIN</b></span>
    <button id="btn-login" class="btn secondary small">Login</button>
    <button id="btn-logout" class="btn secondary small hidden">Logout</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="card">
  <h3>Dashboard</h3>
  <div class="grid">
    <div><b>Today Orders</b><br><span id="d-today">0</span></div>
    <div><b>Week Orders</b><br><span id="d-week">0</span></div>
    <div><b>Month Orders</b><br><span id="d-month">0</span></div>
    <div><b>Items Sold</b><br><span id="d-items">0</span></div>
    <div><b>Order Value</b><br>₹<span id="d-revenue">0</span></div>
    <div><b>Inventory Qty</b><br><span id="inv-items">0</span></div>
    <div><b>Inventory Value</b><br>₹<span id="inv-value">0</span></div>
  </div>
</div>

<!-- ADD / EDIT ITEM -->
<div class="card">
<h3>Add / Edit Item</h3>
<form id="item-form">
<input type="hidden" id="item-id">

<label>Name</label>
<input id="item-name" required>

<label>Category</label>
<input id="item-category">

<label>MRP</label>
<input id="item-mrp" type="number">

<label>Sale Price</label>
<input id="item-price" type="number" required>

<label>Stock</label>
<input id="item-stock" type="number">

<label>Image URL</label>
<input id="item-image">

<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn primary" type="submit">Save Item</button>
<button type="button" class="btn warn hidden" id="btn-delete">Delete</button>
</div>
</form>
</div>

<!-- PRODUCTS -->
<div class="card">
<h3>Products</h3>
<div id="items-list" class="items-grid"></div>
</div>

<!-- ORDERS -->
<div class="card">
<h3>Orders</h3>
<div id="orders-list"></div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const el=id=>document.getElementById(id);
const ADMIN_PIN="Sreekanth@1";

/* ELEMENTS */
const btnLogin=el("btn-login");
const btnLogout=el("btn-logout");
const adminBadge=el("admin-badge");

const dToday=el("d-today");
const dWeek=el("d-week");
const dMonth=el("d-month");
const dItems=el("d-items");
const dRevenue=el("d-revenue");

const invItems=el("inv-items");
const invValue=el("inv-value");

const ordersList=el("orders-list");
const itemsList=el("items-list");

/* LOGIN */
btnLogin.onclick=()=>{
 if(prompt("Enter Admin PIN")===ADMIN_PIN){
  sessionStorage.setItem("admin","1");
  enableAdmin();
 }else alert("Wrong PIN");
};

btnLogout.onclick=()=>{
 sessionStorage.removeItem("admin");
 location.reload();
};

function enableAdmin(){
 adminBadge.classList.remove("hidden");
 btnLogin.classList.add("hidden");
 btnLogout.classList.remove("hidden");
 loadStats(); loadInventory(); loadOrders(); loadItems();
}

if(sessionStorage.getItem("admin")) enableAdmin();

/* DASHBOARD */
async function loadStats(){
 let today=0,week=0,month=0,items=0,revenue=0;
 const now=new Date();
 const d0=new Date(now.setHours(0,0,0,0));
 const w0=new Date(); w0.setDate(w0.getDate()-7);
 const m0=new Date(new Date().getFullYear(),new Date().getMonth(),1);

 const snap=await db.collection("orders").get();
 snap.forEach(doc=>{
  const o=doc.data();
  if(!o.createdAt) return;
  const t=o.createdAt.toDate();
  if(t>=d0)today++;
  if(t>=w0)week++;
  if(t>=m0)month++;
  (o.items||[]).forEach(i=>items+=Number(i.qty||0));
  revenue+=Number(o.total||0);
 });

 dToday.innerText=today;
 dWeek.innerText=week;
 dMonth.innerText=month;
 dItems.innerText=items;
 dRevenue.innerText=revenue;
}

/* INVENTORY */
async function loadInventory(){
 let qty=0,val=0;
 const snap=await db.collection("items").get();
 snap.forEach(doc=>{
  const i=doc.data();
  qty+=Number(i.stock||0);
  val+=Number(i.stock||0)*Number(i.price||0);
 });
 invItems.innerText=qty;
 invValue.innerText=val;
}

/* ADD / UPDATE ITEM */
el("item-form").onsubmit=async e=>{
 e.preventDefault();
 const id=el("item-id").value;
 const data={
  name:el("item-name").value,
  category:el("item-category").value,
  mrp:Number(el("item-mrp").value||0),
  price:Number(el("item-price").value||0),
  stock:Number(el("item-stock").value||0),
  image:el("item-image").value
 };
 if(id) await db.collection("items").doc(id).update(data);
 else await db.collection("items").add(data);

 e.target.reset();
 el("item-id").value="";
 el("btn-delete").classList.add("hidden");
 loadItems(); loadInventory();
};

/* DELETE */
el("btn-delete").onclick=async()=>{
 const id=el("item-id").value;
 if(!id||!confirm("Delete item?"))return;
 await db.collection("items").doc(id).delete();
 el("item-form").reset();
 el("item-id").value="";
 el("btn-delete").classList.add("hidden");
 loadItems(); loadInventory();
};

/* PRODUCTS */
async function loadItems(){
 itemsList.innerHTML="";
 const snap=await db.collection("items").orderBy("name").get();
 snap.forEach(doc=>{
  const i=doc.data();
  const d=document.createElement("div");
  d.className="item-admin";
  d.innerHTML=`
   <b>${i.name}</b><br>
   <span class="muted">₹${i.price} • Stock: ${i.stock}</span><br>
   <button class="btn secondary small">Edit</button>
  `;
  d.querySelector("button").onclick=()=>{
   el("item-id").value=doc.id;
   el("item-name").value=i.name;
   el("item-category").value=i.category||"";
   el("item-mrp").value=i.mrp||0;
   el("item-price").value=i.price||0;
   el("item-stock").value=i.stock||0;
   el("item-image").value=i.image||"";
   el("btn-delete").classList.remove("hidden");
   window.scrollTo({top:0,behavior:"smooth"});
  };
  itemsList.appendChild(d);
 });
}

/* ORDERS */
async function loadOrders(){
 ordersList.innerHTML="";
 const snap=await db.collection("orders").orderBy("createdAt","desc").limit(50).get();
 snap.forEach(doc=>{
  const o=doc.data();
  ordersList.innerHTML+=`
   <div class="order-row">
    <b>${o.customerName}</b><br>
    ₹${o.total} • ${o.status}
   </div>`;
 });
}

});
</script>

</body>
</html>
