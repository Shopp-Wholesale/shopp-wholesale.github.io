<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shopp Wholesale</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* ⭐ GLOBAL & GRID (Restores the 2-Tile Look) */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0; background: #f4f9f4;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .site-header {
      background: #fff; padding: 12px 16px; border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1000;
    }
    .brand-name { font-weight: 800; font-size: 18px; }
    .tagline { font-size: 10px; color: #666; }

    .search-container { padding: 10px 16px; background: #fff; }
    #search {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #ddd; outline: none; background: #fcfcfc;
    }

    /* ⭐ THE GRID: 2 Tiles Mobile, 4 Tiles Web */
    .product-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; padding: 12px; padding-bottom: 100px;
    }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ⭐ CLEAN TILES */
    .card {
      background: #fff; border-radius: 10px; padding: 10px;
      display: flex; flex-direction: column; border: 1px solid #eee;
      height: 100%; position: relative;
    }

    .image-box {
      width: 100%; aspect-ratio: 1/1; background: #f9f9f9;
      border-radius: 6px; margin-bottom: 8px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .product-img { width: 100%; height: 100%; object-fit: contain; }

    .item-name {
      font-size: 13px; font-weight: 600; color: #333;
      height: 34px; overflow: hidden; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .price-row { margin-top: auto; padding: 8px 0; }
    .small-mrp { font-size: 10px; color: #999; text-decoration: line-through; }
    .sale { font-size: 15px; font-weight: 700; color: #000; display: block; }

    /* ⭐ BUTTONS & CONTROLS */
    .add-btn {
      width: 100%; padding: 8px; border-radius: 6px;
      border: 1px solid #19a74a; background: #fff;
      color: #19a74a; font-weight: 700; cursor: pointer; font-size: 12px;
    }
    .qty-controls {
      display: flex; align-items: center; justify-content: space-between;
      background: #f0f4f0; border-radius: 6px; padding: 3px;
    }
    .qty-btn {
      background: #fff; border: none; width: 28px; height: 28px;
      border-radius: 4px; color: #19a74a; font-weight: bold; cursor: pointer;
    }

    /* ⭐ STICKY FOOTER */
    .cart-footer {
      position: fixed; bottom: 0; width: 100%; height: 65px;
      background: #fff; border-top: 1px solid #eee; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center; padding: 0 16px;
    }
    .footer-checkout-btn {
      background: #19a74a; color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; font-weight: 700;
    }

    /* ⭐ MODAL */
    .cart-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 3000; display: flex; align-items: flex-end; justify-content: center;
    }
    .hidden { display: none !important; }
    .cart-content {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto;
    }
    input, textarea, select { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>

<body>

  <header class="site-header">
    <div>
      <div class="brand-name">Shopp Wholesale</div>
      <div class="tagline">Within 24 hrs • Radius: 3 km</div>
    </div>
    <div id="open-cart-btn" style="cursor:pointer; background:#f0f0f0; padding:8px 12px; border-radius:8px;">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <div class="search-container">
    <input id="search" placeholder="Search grocery items..." autocomplete="off">
  </div>

  <div id="products" class="product-grid"></div>

  <div class="cart-footer">
    <div><strong>₹<span id="footer-total">0</span></strong> <span style="font-size:12px; color:#666;">(<span id="footer-item-count">0</span> Items)</span></div>
    <button id="open-cart-btn-2" class="footer-checkout-btn">Checkout</button>
  </div>

  <div id="cart-modal" class="cart-modal hidden">
    <div class="cart-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>Your Cart</h3>
        <button id="close-cart" style="background:none; border:none; font-size:24px;">&times;</button>
      </div>
      <div id="cart-items" style="margin-bottom:15px;"></div>
      <div style="border-top:1px solid #eee; padding:10px 0; font-weight:700;">Total: ₹<span id="total-amount">0</span></div>
      <input id="customer-name" placeholder="Full Name">
      <input id="customer-phone" placeholder="Phone Number">
      <textarea id="customer-address" placeholder="Delivery Address" rows="2"></textarea>
      <select id="payment-mode"><option value="Cash">Cash on Delivery</option><option value="UPI">UPI</option></select>
      <button id="send-whatsapp" style="width:100%; background:#19a74a; color:#fff; border:none; padding:15px; border-radius:10px; font-weight:700;">Place Order on WhatsApp</button>
    </div>
  </div>

  <script>
    // Paste your Firebase Config here
    const firebaseConfig = {
      apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
      authDomain: "shopp-wholesale.firebaseapp.com",
      projectId: "shopp-wholesale",
      storageBucket: "shopp-wholesale.firebasestorage.app",
      messagingSenderId: "811103669232",
      appId: "1:811103669232:web:825724b3738658192b6b35"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  
  <script src="script.js"></script>
</body>
</html>
