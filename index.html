<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shopp Wholesale</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain: "shopp-wholesale.firebaseapp.com",
  projectId: "shopp-wholesale"
});
const db = firebase.firestore();
</script>

<style>
:root{--accent:#19a74a;--bg:#f4f9f4;--muted:#6f6f6f;--img:#eef8ee}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Arial;background:var(--bg)}

.site-header{position:sticky;top:0;background:#fff;padding:14px 18px;display:flex;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.05);z-index:5}
.brand-name{font-size:20px;font-weight:700}
.tagline{font-size:12px;color:var(--muted)}
.cart-display{border:1px solid #ddd;padding:6px 12px;border-radius:6px;font-weight:600}

.controls{padding:12px 16px}
.search-box{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc}

#products{padding:6px 6px 120px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:768px){#products{grid-template-columns:repeat(4,1fr)}}

.card{background:#f7fbf7;border-radius:12px;padding:8px;display:flex;flex-direction:column}
.image-box{background:var(--img);aspect-ratio:1/1;border-radius:8px;overflow:hidden}
.product-img{width:100%;height:100%;object-fit:cover}

.item-name{margin:6px 0 2px;font-size:14px;font-weight:600}
.price{font-size:16px;font-weight:700;margin:4px 0}

.add-btn{
  margin-top:auto;
  height:36px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
}

.cart-footer{
  position:fixed;bottom:0;left:0;right:0;
  height:56px;background:#fff;
  padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 -2px 6px rgba(0,0,0,.08)
}
.footer-checkout-btn{
  background:var(--accent);color:#fff;
  padding:10px 16px;border-radius:10px;border:none;font-weight:700
}

/* ---------- VARIANT MODAL ---------- */
.variant-modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:none;align-items:flex-end;
  z-index:999;
}
.variant-modal.show{display:flex}

.variant-sheet{
  background:#fff;
  width:100%;
  max-height:85%;
  border-radius:16px 16px 0 0;
  padding:16px;
  overflow:auto;
}

.variant-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:16px;
  font-weight:700;
}

.variant-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.variant-info{font-size:14px}
.variant-price{font-weight:700;margin-top:2px}

.variant-btn{
  padding:6px 14px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
}
.variant-btn[disabled]{opacity:.4}

/* ---------- CART MODAL ---------- */
.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;justify-content:center;align-items:center;z-index:1000}
.cart-modal.show{display:flex}
.cart-content{background:#fff;width:92%;max-width:420px;border-radius:14px;padding:16px}
.cart-content input,.cart-content textarea{width:100%;padding:8px;margin:6px 0}
</style>
</head>

<body>

<header class="site-header">
  <div>
    <div class="brand-name">Shopp Wholesale</div>
    <div class="tagline">Fast delivery • 3 km radius</div>
  </div>
  <div class="cart-display" id="cartCount">0</div>
</header>

<div class="controls">
  <input class="search-box" placeholder="Search grocery items…">
</div>

<div id="products"></div>

<div class="cart-footer">
  <div id="footerText">0 items • ₹0</div>
  <button class="footer-checkout-btn" onclick="openCart()">Checkout</button>
</div>

<!-- VARIANT MODAL -->
<div class="variant-modal" id="variantModal">
  <div class="variant-sheet">
    <div class="variant-header">
      <span id="vmName"></span>
      <button onclick="closeVariant()">✕</button>
    </div>
    <div id="variantList"></div>
  </div>
</div>

<!-- CART MODAL -->
<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <input id="custName" placeholder="Your Name">
    <input id="custPhone" placeholder="Phone Number">
    <textarea id="custAddress" placeholder="Delivery Address"></textarea>
    <button class="footer-checkout-btn" onclick="placeWhatsAppOrder()">Place WhatsApp Order</button>
    <br><br>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<script>
const WHATSAPP_NUMBER="919000810084";
let items=[], cart={}, selectedVariant={}, activeProduct=null;

const money=v=>Number(v||0).toFixed(0);

/* ---------- LOAD ---------- */
async function loadItems(){
  const snap = await db.collection("items").get();
  items=[];
  snap.forEach(d=>items.push({...d.data(),id:d.id}));
  render();
}

/* ---------- PRODUCT GRID ---------- */
function render(){
  const box=document.getElementById("products");
  box.innerHTML="";
  items.forEach(p=>{
    const price = p.variants?.length ? p.variants[0].price : p.price;
    box.innerHTML+=`
      <div class="card">
        <div class="image-box">
          <img class="product-img" src="${p.image||'images/placeholder.png'}">
        </div>
        <div class="item-name">${p.name}</div>
        <div class="price">₹${money(price)}</div>
        <button class="add-btn" onclick="openVariant('${p.id}')">Add</button>
      </div>`;
  });
  updateFooter();
}

/* ---------- VARIANT MODAL ---------- */
function openVariant(id){
  activeProduct = items.find(p=>p.id===id);
  vmName.innerText = activeProduct.name;
  renderVariantList();
  variantModal.classList.add("show");
}

function closeVariant(){
  variantModal.classList.remove("show");
}

function renderVariantList(){
  const box=document.getElementById("variantList");
  box.innerHTML="";

  activeProduct.variants.forEach((v,i)=>{
    /* Base price */
    box.innerHTML+=`
      <div class="variant-row">
        <div class="variant-info">
          <div><b>${v.label}</b></div>
          <div class="variant-price">1 qty – ₹${money(v.price)}</div>
        </div>
        <button class="variant-btn"
          ${v.stock<1?"disabled":""}
          onclick="addVariantQty('${activeProduct.id}',${i},1)">
          ${v.stock<1?"Notify":"Add"}
        </button>
      </div>
    `;

    /* Quantity deals */
    (v.deals||[]).forEach(d=>{
      box.innerHTML+=`
        <div class="variant-row" style="padding-left:12px">
          <div class="variant-info">
            <div>${d.qty} qty</div>
            <div class="variant-price">₹${money(d.price)}</div>
          </div>
          <button class="variant-btn"
            ${v.stock<d.qty?"disabled":""}
            onclick="addVariantQty('${activeProduct.id}',${i},${d.qty})">
            ${v.stock<d.qty?"Notify":"Add"}
          </button>
        </div>
      `;
    });
  });
}

function addVariantQty(pid,vidx,qty){
  selectedVariant[pid]=vidx;
  cart[pid]={qty};
  closeVariant();
  updateFooter();
}

/* ---------- CART ---------- */
function updateFooter(){
  let q=0,a=0;
  Object.keys(cart).forEach(id=>{
    const p=items.find(x=>x.id===id);
    const v=p.variants[selectedVariant[id]];
    let price=v.price;
    (v.deals||[]).forEach(d=>{ if(cart[id].qty>=d.qty) price=d.price; });
    q+=cart[id].qty;
    a+=cart[id].qty*price;
  });
  cartCount.innerText=q;
  footerText.innerText=`${q} items • ₹${money(a)}`;
}

function openCart(){
  const box=document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  Object.keys(cart).forEach(id=>{
    const p=items.find(x=>x.id===id);
    const v=p.variants[selectedVariant[id]];
    let price=v.price;
    (v.deals||[]).forEach(d=>{ if(cart[id].qty>=d.qty) price=d.price; });
    box.innerHTML+=`${p.name} (${v.label}) x ${cart[id].qty} = ₹${cart[id].qty*price}<br>`;
    total+=cart[id].qty*price;
  });

  box.innerHTML+=`<br><b>Total: ₹${money(total)}</b>`;
  cartModal.classList.add("show");
}

function closeCart(){cartModal.classList.remove("show");}

/* ---------- WHATSAPP ---------- */
function placeWhatsAppOrder(){
  const name=custName.value, phone=custPhone.value, address=custAddress.value;
  if(!name||!phone||!address) return alert("Fill all details");

  let msg="🛒 *New Order – Shopp Wholesale*\n\n", total=0;

  Object.keys(cart).forEach(id=>{
    const p=items.find(x=>x.id===id);
    const v=p.variants[selectedVariant[id]];
    let price=v.price;
    (v.deals||[]).forEach(d=>{ if(cart[id].qty>=d.qty) price=d.price; });
    msg+=`${p.name} (${v.label}) x ${cart[id].qty} = ₹${cart[id].qty*price}\n`;
    total+=cart[id].qty*price;
  });

  msg+=`\nTotal: ₹${money(total)}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
}

loadItems();
</script>

</body>
</html>
