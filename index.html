<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shopp Wholesale</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain: "shopp-wholesale.firebaseapp.com",
  projectId: "shopp-wholesale"
});
const db = firebase.firestore();
</script>

<style>
:root{--accent:#19a74a;--bg:#f4f9f4;--card:#fff;--muted:#6f6f6f;--img-box:#eef8ee}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,Arial;background:var(--bg)}

.site-header{position:sticky;top:0;background:#fff;padding:14px 18px;display:flex;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.brand-name{font-size:20px;font-weight:700}
.tagline{font-size:12px;color:var(--muted)}
.cart-display{border:1px solid #ddd;padding:6px 12px;border-radius:6px;font-weight:600}

.controls{padding:12px 16px}
.search-box{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc}

#products{padding:6px 6px 120px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:768px){#products{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--bg);border-radius:10px;padding:6px;display:flex;flex-direction:column}
.image-box{background:var(--img-box);aspect-ratio:1/1;border-radius:6px;overflow:hidden}
.product-img{width:100%;height:100%;object-fit:cover}

.item-name{margin:6px 0 2px;font-size:13.5px;font-weight:600}

.variant-select{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:13px;
}

.price-row{display:flex;gap:6px}
.small-mrp{font-size:11px;text-decoration:line-through;color:#777}
.sale{font-size:16px;font-weight:700}

.qty-controls{margin-top:6px;display:flex;gap:6px;align-items:center}
.qty-controls button{width:28px;height:28px;border-radius:6px;border:1px solid #ccc;background:#fff;font-weight:700}
.qty-display{min-width:22px;text-align:center}

.add-btn{margin-top:6px;height:34px;border-radius:6px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-weight:600}
.add-btn[disabled]{opacity:.4}

.cart-footer{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 6px rgba(0,0,0,.08)}
.footer-checkout-btn{background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;border:none;font-weight:700}

.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;justify-content:center;align-items:center}
.cart-modal.show{display:flex}
.cart-content{background:#fff;width:92%;max-width:420px;border-radius:14px;padding:16px}
.cart-content input,.cart-content textarea{width:100%;padding:8px;margin:6px 0}
</style>
</head>

<body>

<header class="site-header">
  <div>
    <div class="brand-name">Shopp Wholesale</div>
    <div class="tagline">Fast delivery • 3 km radius</div>
  </div>
  <div class="cart-display" id="cartCount">0</div>
</header>

<div class="controls">
  <input class="search-box" placeholder="Search grocery items…">
</div>

<div id="products"></div>

<div class="cart-footer">
  <div id="footerText">0 items • ₹0</div>
  <button class="footer-checkout-btn" onclick="openCart()">Checkout</button>
</div>

<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <input id="custName" placeholder="Your Name">
    <input id="custPhone" placeholder="Phone Number">
    <textarea id="custAddress" placeholder="Delivery Address"></textarea>
    <button class="footer-checkout-btn" onclick="placeWhatsAppOrder()">Place WhatsApp Order</button>
    <br><br>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<script>
const WHATSAPP_NUMBER="919000810084";
let items=[], cart={}, selectedVariant={};

function money(v){return Number(v||0).toFixed(0);}

function getVariantPrice(v, qty){
  let p=v.price;
  (v.deals||[]).forEach(d=>{
    if(qty>=d.qty) p=d.price;
  });
  return p;
}

async function loadItems(){
  const snap=await db.collection("items").get();
  items=[];
  snap.forEach(d=>items.push({...d.data(),id:d.id}));
  render();
}

function render(){
  const box=document.getElementById("products");
  box.innerHTML="";

  items.forEach(p=>{
    const hasVariants=Array.isArray(p.variants)&&p.variants.length;
    if(hasVariants && selectedVariant[p.id]==null) selectedVariant[p.id]=0;

    const v=hasVariants?p.variants[selectedVariant[p.id]]:null;
    const qty=cart[p.id]?.qty||0;
    const stock=v?v.stock:p.stock;
    const price=v?getVariantPrice(v,qty||1):p.price;
    const mrp=v?v.mrp:p.mrp;

    box.innerHTML+=`
    <div class="card">
      <div class="image-box"><img class="product-img" src="${p.image||'images/placeholder.png'}"></div>
      <div class="item-name">${p.name}</div>

      ${hasVariants?`
        <select class="variant-select" onchange="changeVariant('${p.id}',this.value)">
          ${p.variants.map((x,i)=>{
            let text = `${x.label} – 1 qty ₹${money(x.price)}`;
            (x.deals||[]).forEach(d=>{
              text += ` | ${d.qty} qty ₹${money(d.price)}`;
            });
            return `<option value="${i}">${text}</option>`;
          }).join("")}
        </select>`:""}

      <div class="price-row">
        ${mrp?`<div class="small-mrp">₹${money(mrp)}</div>`:""}
        <div class="sale">₹${money(price)}</div>
      </div>

      <div class="qty-controls">
        <button onclick="qty('${p.id}',-1)">-</button>
        <div class="qty-display">${qty}</div>
        <button onclick="qty('${p.id}',1)" ${stock<=0?"disabled":""}>+</button>
      </div>

      <button class="add-btn" ${stock<=0?"disabled":""} onclick="qty('${p.id}',1)">
        ${stock<=0?"Out of Stock":"Add to cart"}
      </button>
    </div>`;
  });

  updateFooter();
}

function changeVariant(id,idx){
  selectedVariant[id]=Number(idx);
  cart[id]=null;
  render();
}

function qty(id,d){
  const p=items.find(x=>x.id===id);
  const v=p.variants?p.variants[selectedVariant[id]]:null;
  const max=v?v.stock:p.stock;

  cart[id]=cart[id]||{qty:0};
  cart[id].qty+=d;
  if(cart[id].qty<0) cart[id].qty=0;
  if(cart[id].qty>max) cart[id].qty=max;
  render();
}

function updateFooter(){
  let q=0,a=0;
  Object.keys(cart).forEach(id=>{
    if(!cart[id]) return;
    const p=items.find(x=>x.id===id);
    const v=p.variants?p.variants[selectedVariant[id]]:null;
    const price=v?getVariantPrice(v,cart[id].qty):p.price;
    q+=cart[id].qty;
    a+=cart[id].qty*price;
  });
  cartCount.innerText=q;
  footerText.innerText=`${q} items • ₹${money(a)}`;
}

function openCart(){
  const box=document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  Object.keys(cart).forEach(id=>{
    const p=items.find(x=>x.id===id);
    const v=p.variants?p.variants[selectedVariant[id]]:null;
    const price=v?getVariantPrice(v,cart[id].qty):p.price;
    box.innerHTML+=`${p.name} ${v?`(${v.label})`:""} x ${cart[id].qty} = ₹${cart[id].qty*price}<br>`;
    total+=cart[id].qty*price;
  });

  box.innerHTML+=`<br><b>Total: ₹${money(total)}</b>`;
  cartModal.classList.add("show");
}

function closeCart(){cartModal.classList.remove("show");}

async function placeWhatsAppOrder(){
  const name=custName.value.trim();
  const phone=custPhone.value.trim();
  const address=custAddress.value.trim();
  if(!name||!phone||!address){alert("Fill all details");return;}

  let msg="🛒 *New Order – Shopp Wholesale*\n\n";
  let total=0;

  Object.keys(cart).forEach(id=>{
    const p=items.find(x=>x.id===id);
    const v=p.variants?p.variants[selectedVariant[id]]:null;
    const price=v?getVariantPrice(v,cart[id].qty):p.price;
    msg+=`${p.name} ${v?`(${v.label})`:""} x ${cart[id].qty} = ₹${cart[id].qty*price}\n`;
    total+=cart[id].qty*price;
  });

  msg+=`\nTotal: ₹${money(total)}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
}

loadItems();
</script>

</body>
</html>
