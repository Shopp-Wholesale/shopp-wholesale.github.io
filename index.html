<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shopp Wholesale</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain: "shopp-wholesale.firebaseapp.com",
  projectId: "shopp-wholesale"
});
const db = firebase.firestore();
</script>

<style>
:root{--accent:#19a74a;--bg:#f4f9f4;--muted:#6f6f6f;--img:#eef8ee}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,Arial;background:var(--bg)}

.site-header{position:sticky;top:0;background:#fff;padding:14px 18px;display:flex;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.05);z-index:5}
.brand-name{font-size:20px;font-weight:700}
.tagline{font-size:12px;color:var(--muted)}
.cart-display{border:1px solid #ddd;padding:6px 12px;border-radius:6px;font-weight:600}

.controls{padding:12px 16px}
.search-box{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc}

#products{padding:8px 8px 120px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){#products{grid-template-columns:repeat(4,1fr)}}

.card{background:#f7fbf7;border-radius:14px;padding:8px;display:flex;flex-direction:column}
.image-box{background:var(--img);aspect-ratio:1/1;border-radius:10px;overflow:hidden}
.product-img{width:100%;height:100%;object-fit:cover}

.item-name{margin:6px 0 2px;font-size:14px;font-weight:600}
.price{font-size:16px;font-weight:700;margin-bottom:6px}

.add-btn{
  height:36px;
  border-radius:8px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
}

.qty-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:6px;
}

.qty-btn{
  width:28px;height:28px;
  border-radius:6px;
  border:1px solid var(--accent);
  background:#fff;
  color:var(--accent);
  font-weight:700;
}
.qty-count{min-width:18px;text-align:center}

.cart-footer{
  position:fixed;bottom:0;left:0;right:0;
  height:56px;background:#fff;
  padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 -2px 6px rgba(0,0,0,.08)
}
.footer-checkout-btn{
  background:var(--accent);color:#fff;
  padding:10px 16px;border-radius:10px;border:none;font-weight:700
}

/* ---------- VARIANT MODAL ---------- */
.variant-modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:flex-end;
  z-index:999;
}
.variant-modal.show{display:flex}

.variant-sheet{
  background:#fff;
  width:100%;
  max-height:90%;
  border-radius:16px 16px 0 0;
  padding:16px;
  overflow:auto;
}

.variant-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-size:16px;
  font-weight:700;
}

.variant-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.variant-info{font-size:14px}
.variant-price{font-weight:700;margin-top:2px}

/* ---------- CART MODAL ---------- */
.cart-modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;justify-content:center;align-items:center;z-index:1000}
.cart-modal.show{display:flex}
.cart-content{background:#fff;width:92%;max-width:420px;border-radius:14px;padding:16px}
.cart-content input,.cart-content textarea{width:100%;padding:8px;margin:6px 0}
</style>
</head>

<body>

<header class="site-header">
  <div>
    <div class="brand-name">Shopp Wholesale</div>
    <div class="tagline">Fast delivery • 3 km radius</div>
  </div>
  <div class="cart-display" id="cartCount">0</div>
</header>

<div class="controls">
  <input class="search-box" placeholder="Search grocery items…">
</div>

<div id="products"></div>

<div class="cart-footer">
  <div id="footerText">0 items • ₹0</div>
  <button class="footer-checkout-btn" onclick="openCart()">Checkout</button>
</div>

<!-- VARIANT MODAL -->
<div class="variant-modal" id="variantModal">
  <div class="variant-sheet">
    <div class="variant-header">
      <span id="vmName"></span>
      <button onclick="closeVariant()">✕</button>
    </div>
    <div id="variantList"></div>
  </div>
</div>

<!-- CART MODAL -->
<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <input id="custName" placeholder="Your Name">
    <input id="custPhone" placeholder="Phone Number">
    <textarea id="custAddress" placeholder="Delivery Address"></textarea>
    <button class="footer-checkout-btn" onclick="placeWhatsAppOrder()">Place WhatsApp Order</button>
    <br><br>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<script>
const WHATSAPP_NUMBER="919000810084";
let items=[], cart={}, activeProduct=null;

const money=v=>Number(v||0).toFixed(0);

/* ---------- LOAD ---------- */
async function loadItems(){
  const snap = await db.collection("items").get();
  items=[];
  snap.forEach(d=>items.push({...d.data(),id:d.id}));
  render();
}

/* ---------- PRODUCT GRID ---------- */
function render(){
  products.innerHTML="";
  items.forEach(p=>{
    const hasVariants = Array.isArray(p.variants) && p.variants.length;
    const basePrice = hasVariants ? p.variants[0].price : p.price;
    const key = p.id;

    const qty = cart[key]?.count || 0;

    products.innerHTML+=`
      <div class="card">
        <div class="image-box">
          <img class="product-img" src="${p.image||'images/placeholder.png'}">
        </div>
        <div class="item-name">${p.name}</div>
        <div class="price">₹${money(basePrice)}</div>

        ${
          hasVariants
          ? `<button class="add-btn" onclick="openVariant('${p.id}')">⬇ Options</button>`
          : `
            <div class="qty-box">
              <button class="qty-btn" onclick="simpleQty('${p.id}',-1)">−</button>
              <div class="qty-count">${qty}</div>
              <button class="qty-btn" onclick="simpleQty('${p.id}',1)">+</button>
            </div>
          `
        }
      </div>`;
  });
  updateFooter();
}

/* ---------- SIMPLE ITEMS ---------- */
function simpleQty(id,delta){
  cart[id]=cart[id]||{count:0,price:items.find(p=>p.id===id).price};
  cart[id].count=Math.max(0,cart[id].count+delta);
  render();
}

/* ---------- VARIANT MODAL ---------- */
function openVariant(id){
  activeProduct=items.find(p=>p.id===id);
  vmName.innerText=activeProduct.name;
  renderVariantList();
  variantModal.classList.add("show");
}
function closeVariant(){variantModal.classList.remove("show");}

function renderVariantList(){
  variantList.innerHTML="";
  activeProduct.variants.forEach((v,vidx)=>{
    const rows=[{qty:1,price:v.price},...(v.deals||[])];
    rows.forEach(d=>{
      const key=`${activeProduct.id}_${vidx}_${d.qty}`;
      const count=cart[key]?.count||0;
      variantList.innerHTML+=`
        <div class="variant-row">
          <div class="variant-info">
            <div><b>${v.label}</b></div>
            <div class="variant-price">${d.qty} qty – ₹${money(d.price)}</div>
          </div>
          <div class="qty-box">
            <button class="qty-btn" onclick="variantQty('${key}','${activeProduct.id}',${vidx},${d.qty},${d.price},-1)">−</button>
            <div class="qty-count">${count}</div>
            <button class="qty-btn" onclick="variantQty('${key}','${activeProduct.id}',${vidx},${d.qty},${d.price},1)">+</button>
          </div>
        </div>`;
    });
  });
}

function variantQty(key,pid,vidx,dealQty,price,delta){
  cart[key]=cart[key]||{pid,vidx,dealQty,price,count:0};
  cart[key].count=Math.max(0,cart[key].count+delta);
  renderVariantList();
  updateFooter();
}

/* ---------- FOOTER / CART ---------- */
function updateFooter(){
  let q=0,a=0;
  Object.values(cart).forEach(c=>{
    q+=c.count*(c.dealQty||1);
    a+=c.count*(c.dealQty||1)*(c.price||0);
  });
  cartCount.innerText=q;
  footerText.innerText=`${q} items • ₹${money(a)}`;
}

function openCart(){
  cartItems.innerHTML="";
  let total=0;
  Object.values(cart).forEach(c=>{
    if(!c.count) return;
    const p=items.find(x=>x.id===c.pid||x.id===c.id);
    cartItems.innerHTML+=`${p.name} x ${c.count*(c.dealQty||1)} = ₹${c.count*(c.dealQty||1)*(c.price||0)}<br>`;
    total+=c.count*(c.dealQty||1)*(c.price||0);
  });
  cartItems.innerHTML+=`<br><b>Total: ₹${money(total)}</b>`;
  cartModal.classList.add("show");
}
function closeCart(){cartModal.classList.remove("show");}

function placeWhatsAppOrder(){
  if(!custName.value||!custPhone.value||!custAddress.value) return alert("Fill all details");
  let msg="🛒 *New Order – Shopp Wholesale*\n\n",total=0;
  Object.values(cart).forEach(c=>{
    if(!c.count) return;
    const p=items.find(x=>x.id===c.pid||x.id===c.id);
    msg+=`${p.name} x ${c.count*(c.dealQty||1)} = ₹${c.count*(c.dealQty||1)*(c.price||0)}\n`;
    total+=c.count*(c.dealQty||1)*(c.price||0);
  });
  msg+=`\nTotal: ₹${money(total)}\nName: ${custName.value}\nPhone: ${custPhone.value}\nAddress: ${custAddress.value}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`);
}

loadItems();
</script>

</body>
</html>
