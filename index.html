<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopp Wholesale</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
  authDomain: "shopp-wholesale.firebaseapp.com",
  projectId: "shopp-wholesale"
});
const db = firebase.firestore();
</script>

<style>
body{margin:0;font-family:system-ui;background:#f4f9f4}
.header{padding:14px;background:#fff;display:flex;justify-content:space-between}
.cart{font-weight:bold}
#products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.card{background:#fff;border-radius:8px;padding:8px}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.out{color:red;font-weight:bold;font-size:13px}
button{padding:6px 10px}
.disabled{opacity:.4;pointer-events:none}
</style>
</head>

<body>

<div class="header">
  <div>Shopp Wholesale</div>
  <div class="cart" id="cartCount">0</div>
</div>

<div id="products"></div>

<button onclick="openCart()">Checkout</button>

<div id="cartBox" style="display:none;background:#fff;padding:12px">
  <div id="cartItems"></div>
  <input id="custName" placeholder="Name"><br>
  <input id="custPhone" placeholder="Phone"><br>
  <textarea id="custAddress" placeholder="Address"></textarea><br>
  <button onclick="placeOrder()">Place Order</button>
  <button onclick="closeCart()">Close</button>
</div>

<script>
let items=[],cart={};

function money(v){return Number(v||0).toFixed(0);}

async function loadItems(){
  const snap=await db.collection("items").get();
  items=[];
  snap.forEach(d=>items.push({...d.data(),id:d.id}));
  render();
}

function render(){
  const box=document.getElementById("products");
  box.innerHTML="";
  items.forEach(p=>{
    const q=cart[p.id]||0;
    const out=p.stock<=0;

    box.innerHTML+=`
    <div class="card">
      <img src="${p.image}">
      <b>${p.name}</b><br>
      ₹${money(p.price)}<br>
      ${out?`<div class="out">OUT OF STOCK</div>`:""}
      <div>
        <button ${out?"disabled":""} onclick="qty('${p.id}',-1)">-</button>
        ${q}
        <button ${out?"disabled":""} onclick="qty('${p.id}',1)">+</button>
      </div>
      <button class="${out?"disabled":""}" onclick="add('${p.id}')">Add</button>
    </div>`;
  });
  updateCart();
}

function qty(id,d){
  const it=items.find(x=>x.id===id);
  if(!it || it.stock<=0) return;
  cart[id]=(cart[id]||0)+d;
  if(cart[id]<0) cart[id]=0;
  if(cart[id]>it.stock) cart[id]=it.stock;
  render();
}

function add(id){
  const it=items.find(x=>x.id===id);
  if(it.stock<=0) return;
  cart[id]=(cart[id]||0)+1;
  if(cart[id]>it.stock) cart[id]=it.stock;
  render();
}

function updateCart(){
  let q=0;
  for(let id in cart) q+=cart[id];
  cartCount.innerText=q;
}

function openCart(){
  let box=document.getElementById("cartItems"),t=0;
  box.innerHTML="";
  for(let id in cart){
    const it=items.find(x=>x.id===id);
    box.innerHTML+=`${it.name} x ${cart[id]}<br>`;
    t+=cart[id]*it.price;
  }
  box.innerHTML+=`<b>Total ₹${t}</b>`;
  cartBox.style.display="block";
}

function closeCart(){cartBox.style.display="none";}

async function placeOrder(){
  const name=custName.value,phone=custPhone.value,address=custAddress.value;
  if(!name||!phone||!address) return alert("Fill all");

  const batch=db.batch();
  const orderItems=[];
  let total=0;

  for(let id in cart){
    const it=items.find(x=>x.id===id);
    if(cart[id]>it.stock) return alert("Stock changed. Refresh.");

    const ref=db.collection("items").doc(id);
    batch.update(ref,{stock:it.stock-cart[id]});

    orderItems.push({id,name:it.name,qty:cart[id],price:it.price});
    total+=cart[id]*it.price;
  }

  const orderRef=db.collection("orders").doc();
  batch.set(orderRef,{
    customerName:name,
    customerPhone:phone,
    customerAddress:address,
    items:orderItems,
    total:total,
    createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    status:"new"
  });

  await batch.commit();
  alert("Order placed");
  cart={};
  closeCart();
  loadItems();
}

loadItems();
</script>

</body>
</html>
