<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Shopp Wholesale</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    /* ⭐ GLOBAL RESET */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    body {
      background: #ffffff; /* Seamless white background */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .site-header {
      background: #fff; padding: 12px 16px; border-bottom: 1px solid #f0f0f0;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1000;
    }
    .brand-name { font-weight: 800; font-size: 18px; }

    .search-container { padding: 10px 16px; background: #fff; }
    #search {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #eee; outline: none; background: #f9f9f9;
    }

    /* ⭐ THE GRID - 1px Separators */
    .product-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 1px; background: #eeeeee; /* Creates thin line separators */
      padding-bottom: 120px;
    }

    /* ⭐ PLAIN TEXT CARD */
    .card {
      background: #fff; display: flex; flex-direction: column;
      height: 100%; overflow: hidden;
    }

    .image-box {
      width: 100%; aspect-ratio: 1/1; overflow: hidden;
    }
    
    .product-img { 
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* ⭐ INFO SECTION (Plain Text, No white box) */
    .info-section {
      padding: 12px 10px 0 10px;
      flex-grow: 1;
      background: transparent;
    }

    .item-name {
      font-size: 13px; font-weight: 500; color: #333;
      height: 34px; overflow: hidden; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .price-row { margin-top: 6px; display: flex; align-items: baseline; }
    .small-mrp { font-size: 10px; color: #aaa; text-decoration: line-through; margin-right: 4px; }
    .sale { font-size: 15px; font-weight: 800; color: #000; }

    /* ⭐ PLAIN QTY CONTROLS (Edge-to-Edge) */
    .qty-controls {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; height: 48px; margin-top: 12px;
      border-top: 1px solid #f5f5f5; /* Clean divider line */
      background: transparent; /* Makes it look like plain text */
    }
    .qty-btn {
      background: transparent; border: none; width: 50px; height: 100%;
      color: #19a74a; font-weight: bold; cursor: pointer; font-size: 22px;
    }
    .qty-num { font-weight: 700; font-size: 15px; color: #333; }

    /* ⭐ FOOTER */
    .cart-footer {
      position: fixed; bottom: 0; width: 100%; height: 70px;
      background: #fff; border-top: 1px solid #f0f0f0; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center; padding: 0 16px;
    }
    .footer-checkout-btn {
      background: #19a74a; color: #fff; border: none;
      padding: 12px 24px; border-radius: 10px; font-weight: 700;
    }

    /* ⭐ MODAL */
    .cart-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 3000; display: flex; align-items: flex-end; justify-content: center;
    }
    .hidden { display: none !important; }
    .cart-content {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto;
    }
    input, textarea, select { width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="brand-name">Shopp Wholesale</div>
    <div id="open-cart-btn" style="cursor:pointer; background:#f5f5f5; padding:8px 12px; border-radius:8px;">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <div class="search-container">
    <input id="search" placeholder="Search grocery items..." autocomplete="off">
  </div>

  <div id="products" class="product-grid"></div>

  <div class="cart-footer">
    <div><strong>₹<span id="footer-total">0</span></strong></div>
    <button id="open-cart-btn-2" class="footer-checkout-btn">Checkout</button>
  </div>

  <div id="cart-modal" class="cart-modal hidden">
    <div class="cart-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>Your Order</h3>
        <button id="close-cart" style="background:none; border:none; font-size:24px;">&times;</button>
      </div>
      <div id="cart-items" style="margin-bottom:15px;"></div>
      <input id="customer-name" placeholder="Name">
      <textarea id="customer-address" placeholder="Address" rows="2"></textarea>
      <button id="send-whatsapp" style="width:100%; background:#19a74a; color:#fff; border:none; padding:15px; border-radius:10px; font-weight:700;">Place Order on WhatsApp</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDCM_KCDiyDzEEQaqUI66TNpv-l4L8dnzo",
      authDomain: "shopp-wholesale.firebaseapp.com",
      projectId: "shopp-wholesale",
      storageBucket: "shopp-wholesale.firebasestorage.app",
      messagingSenderId: "811103669232",
      appId: "1:811103669232:web:825724b3738658192b6b35"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allItems = [];
    let cart = {};

    async function loadData() {
      const snap = await db.collection("items").get();
      allItems = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderUI(allItems);
    }

    function renderUI(items) {
      document.getElementById("products").innerHTML = items.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="card">
            <div class="image-box"><img src="${item.image}" class="product-img"></div>
            <div class="info-section">
              <div class="item-name">${item.name}</div>
              <div class="price-row">
                <span class="small-mrp">₹${item.mrp || item.price}</span>
                <span class="sale">₹${item.price}</span>
              </div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
              <span class="qty-num">${qty}</span>
              <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
            </div>
          </div>`;
      }).join('');
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      let t = 0, c = 0;
      Object.keys(cart).forEach(k => {
        const i = allItems.find(p => p.id === k);
        t += i.price * cart[k]; c += cart[k];
      });
      document.getElementById("footer-total").innerText = t;
      document.getElementById("cart-count").innerText = c;
      renderUI(allItems);
    }

    const modal = document.getElementById("cart-modal");
    document.getElementById("open-cart-btn").onclick = () => modal.classList.remove("hidden");
    document.getElementById("open-cart-btn-2").onclick = () => modal.classList.remove("hidden");
    document.getElementById("close-cart").onclick = () => modal.classList.add("hidden");

    loadData();
  </script>
</body>
</html>
